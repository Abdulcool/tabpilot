<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="brand">
      <img src="../icons/icon32.png" width="20" height="20" alt="" />
      <h1>TabPilot</h1>
      <span class="count-badge" id="tab-count" title="Open tabs"></span>
    </div>
    <div class="toolbar">
      <button id="btn-dedupe" class="tool" title="Close duplicate tabs (Alt+Shift+D)">
        <svg viewBox="0 0 16 16"><path d="M4 2h6l4 4v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zM2 1h7l-7 7z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        <span>Dedupe</span>
      </button>
      <button id="btn-group" class="tool" title="Group tabs by site (Alt+Shift+G)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1" y="1" width="6" height="6" rx="1.5"/><rect x="9" y="1" width="6" height="6" rx="1.5"/><rect x="1" y="9" width="6" height="6" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx="1.5"/></svg>
        <span>Group</span>
      </button>
      <button id="btn-ungroup" class="tool" title="Ungroup all tabs">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1" y="1" width="6" height="6" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx="1.5"/><path d="M9 5h4M5 9v4" /></svg>
        <span>Ungroup</span>
      </button>
      <button id="btn-save" class="tool accent" title="Save all windows as a session">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 2h12v12H2zM4 2v4h8V2M5 15v-6h6v6"/></svg>
        <span>Save</span>
      </button>
    </div>
    <div class="search-row">
      <svg class="search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="5"/><path d="m11 11 4 4"/></svg>
      <input id="search" type="text" placeholder="Search tabs… (type to filter, Enter to switch)"
             autocomplete="off" spellcheck="false" />
      <kbd>Alt+T</kbd>
    </div>
  </header>

  <main>
    <ul id="results" role="listbox" aria-label="Open tabs"></ul>

    <section id="sessions-section">
      <h2>Sessions <span id="session-count" class="dim-count"></span></h2>
      <ul id="sessions"></ul>
      <p id="no-sessions" class="empty-note" hidden>
        No saved sessions yet. Press <kbd>S</kbd> to snapshot every open window —
        close the browser, come back later, restore in one click.
      </p>
    </section>
  </main>

  <footer>
    <span id="status" role="status"></span>
    <span class="hints">
      <kbd>↑↓</kbd> navigate <kbd>Enter</kbd> switch <kbd>⌫</kbd> close
      <kbd>D</kbd> dedupe <kbd>G</kbd> group <kbd>S</kbd> save
    </span>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
