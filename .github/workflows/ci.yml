name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/
      - run: node scripts/lint.mjs

  webstore-package:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Zip extension
        run: |
          zip -r tabpilot.zip manifest.json icons src -x '*.DS_Store'
      - uses: actions/upload-artifact@v4
        with:
          name: tabpilot-extension
          path: tabpilot.zip
